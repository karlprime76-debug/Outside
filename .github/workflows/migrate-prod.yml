name: Apply Prisma migration (prod)

on:
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply pending migrations via psql + Prisma resolve
        shell: bash
        run: |
          # psql doesn't support pgbouncer param — strip it
          PGURL=$(echo "${{ secrets.DIRECT_URL }}" | sed 's/[?&]pgbouncer=true//')
          echo "Using: $PGURL"
          
          APPLIED=$(psql -t -A "$PGURL" -c "SELECT migration_name FROM _prisma_migrations ORDER BY started_at" 2>/dev/null || echo "")
          
          for dir in prisma/migrations/*/; do
            name=$(basename "$dir")
            sql="$dir/migration.sql"
            [ ! -f "$sql" ] && continue
            if echo "$APPLIED" | grep -qx "$name"; then
              echo "✓ $name"
            else
              echo "→ Applying $name..."
              psql "$PGURL" -f "$sql" -v ON_ERROR_STOP=1
              echo "→ Resolving $name with Prisma..."
              npx prisma migrate resolve --applied "$name"
              echo "✓ $name done"
            fi
          done
