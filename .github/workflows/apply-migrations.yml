name: Apply Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run demo seed after migration'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Generate Prisma client
        run: npx prisma generate
        timeout-minutes: 5

      - name: Step 1 — Apply pending migrations normally
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Apply any pending migrations ==="
          npx prisma migrate deploy
          echo "✓ migrate deploy done."

      - name: Step 2 — Sync ALL remaining schema differences (safe, additive only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Sync all remaining tables, columns, enums ==="
          echo "Adds whatever is missing, never drops anything."
          echo "y" | npx prisma db push --skip-generate 2>&1 || echo "⚠ db push had issues (may need manual review). Continuing..."
          echo "✓ db push sync done."

      - name: Step 3 — Report final migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Final migration status ==="
          npx prisma migrate status

      - name: Seed demo data (conditional)
        if: ${{ github.event.inputs.run_seed == 'true' }}
        env:
          DEMO_MODE: '1'
        run: npm run db:seed:demo
        timeout-minutes: 15
