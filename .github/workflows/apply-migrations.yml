name: Apply Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run demo seed after migration'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  MIGRATION_NAME: "20240607_add_referral_code"

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Generate Prisma client
        run: npx prisma generate
        timeout-minutes: 5

      - name: Apply or reconcile migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
        run: |
          set +e
          MIGRATION_FILE="prisma/migrations/$MIGRATION_NAME/migration.sql"
          DB_URL="${DIRECT_URL:-$DATABASE_URL}"

          echo "=== Step 1: Check current migration status ==="
          npx prisma migrate status

          echo ""
          echo "=== Step 2: Attempt normal migration deploy ==="
          npx prisma migrate deploy
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✓ Migration deployed successfully."
            exit 0
          fi

          echo ""
          echo "=== Step 3: Direct deploy failed — applying migration SQL manually ==="
          echo "Reason: likely P3005 (database has tables but no _prisma_migrations history)."

          npx prisma db execute --file="$MIGRATION_FILE" --url "$DB_URL"
          DB_EXEC_CODE=$?

          if [ $DB_EXEC_CODE -ne 0 ]; then
            echo "✗ prisma db execute failed (exit code $DB_EXEC_CODE)."
            exit $DB_EXEC_CODE
          fi

          echo ""
          echo "=== Step 4: Mark migration as applied in history ==="
          npx prisma migrate resolve --applied "$MIGRATION_NAME"

          echo ""
          echo "=== Step 5: Re-run migrate deploy to confirm sync ==="
          npx prisma migrate deploy

      - name: Seed demo data (conditional)
        if: ${{ github.event.inputs.run_seed == 'true' }}
        env:
          DEMO_MODE: '1'
        run: npm run db:seed:demo
        timeout-minutes: 15
