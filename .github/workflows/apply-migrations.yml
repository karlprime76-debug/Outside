name: Apply Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run demo seed after migration'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Prepare Prisma environment
        run: |
          echo "Preparing Prisma env"
          if [ -n "${{ secrets.CI_DIRECT_URL }}" ]; then
            echo "DIRECT_URL=${{ secrets.CI_DIRECT_URL }}" >> $GITHUB_ENV
          else
            echo "DIRECT_URL=${DATABASE_URL}" >> $GITHUB_ENV
          fi

      - name: Generate Prisma client
        run: npx prisma generate
        timeout-minutes: 5

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
        run: |
          echo "DATABASE_URL configured: true"
          echo "Starting Prisma migrate deploy..."
          npx prisma migrate deploy

      - name: Seed demo data (conditional)
        if: ${{ github.event.inputs.run_seed == 'true' }}
        env:
          DEMO_MODE: '1'
        run: npm run db:seed:demo
        timeout-minutes: 15
